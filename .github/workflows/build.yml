name: Build & Release

# Se dispara al pushear un tag "v*" (ej: v0.2.0). Para probar el build sin
# publicar un Release todavía, también se puede correr a mano desde la
# pestaña Actions (workflow_dispatch) — en ese caso solo deja los binarios
# como artifacts descargables, no crea un Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Sin esto, el GITHUB_TOKEN que arma GitHub automáticamente solo tiene
# permiso de lectura, y crear un Release falla con "Resource not
# accessible by integration". Con esta línea le damos permiso de
# escritura únicamente dentro de este workflow (no cambia nada en el
# repo en general).
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: uwu-tracker.exe
            asset_name: uwu-tracker-windows.exe
          - os: macos-latest
            artifact_name: uwu-tracker
            asset_name: uwu-tracker-macos
          - os: ubuntu-latest
            artifact_name: uwu-tracker
            asset_name: uwu-tracker-linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Compilar con PyInstaller
        run: pyinstaller uwu-tracker.spec

      - name: Renombrar binario (para no pisar el de otro SO al publicar)
        shell: bash
        run: |
          mkdir -p out
          cp "dist/${{ matrix.artifact_name }}" "out/${{ matrix.asset_name }}"

      # Queda descargable desde la pestaña Actions -> este run, aunque no
      # sea un tag (útil para probar un branch antes de taggear).
      - name: Subir como artifact del run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: out/${{ matrix.asset_name }}

      - name: Adjuntar al Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
